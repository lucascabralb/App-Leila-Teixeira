:root{
  --bg:#050506; --bg-2:#0a0a0c;
  --glass:rgba(255,255,255,0.055); --glass-2:rgba(255,255,255,0.09); --glass-3:rgba(255,255,255,0.14);
  --border:rgba(255,255,255,0.10); --border-soft:rgba(255,255,255,0.06);
  --accent:#c70088; --accent-2:#950066;
  --accent-dim:rgba(199,0,136,0.14); --accent-border:rgba(199,0,136,0.34);
  --accent-glow:0 0 28px rgba(199,0,136,0.28);
  --accent-glow-color:rgba(199,0,136,0.5);
  --t1:rgba(255,255,255,0.97); --t2:rgba(255,255,255,0.62); --t3:rgba(255,255,255,0.36);
  --danger:#F0605B; --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
  --nav-h:74px; --r:20px; --r-sm:14px; --r-lg:28px; --ease:cubic-bezier(.22,1,.36,1);
  --blur:blur(28px) saturate(180%);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Manrope',system-ui,sans-serif;color:var(--t1);-webkit-font-smoothing:antialiased}
#app{width:100%;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;max-width:560px;margin:0 auto;background:var(--bg)}
.page{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:translateY(10px) scale(.98);transition:opacity .38s var(--ease),transform .38s var(--ease);padding-top:var(--safe-top);padding-bottom:calc(var(--nav-h) + var(--safe-bot) + 14px);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.page.active{opacity:1;pointer-events:all;transform:translateY(0) scale(1)}
.page::-webkit-scrollbar{display:none}

/* Floating glass nav */
#nav{position:fixed;left:16px;right:16px;bottom:calc(var(--safe-bot) + 14px);max-width:528px;margin:0 auto;height:var(--nav-h);background:rgba(14,14,17,0.62);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border-soft);border-radius:26px;display:flex;align-items:center;justify-content:space-around;z-index:100;box-shadow:0 20px 50px -12px rgba(0,0,0,.6)}
.ni{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;-webkit-user-select:none;user-select:none;position:relative}
.ni:active{opacity:.6}
.ni svg{width:21px;height:21px;stroke:var(--t3);fill:none;stroke-width:1.6;transition:stroke .25s var(--ease)}
.ni span{font-size:9.5px;font-weight:700;color:var(--t3);letter-spacing:.2px;transition:color .25s var(--ease)}
.ni.on svg{stroke:var(--accent);filter:drop-shadow(0 0 5px rgba(199,0,136,0.5))}
.ni.on span{color:var(--accent)}
.ni-dot{display:none}

.ph{padding:22px 22px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 65%,transparent)}
.ph h1{font-size:29px;font-weight:800;letter-spacing:-.9px}
.back{display:flex;align-items:center;gap:2px;cursor:pointer;color:var(--t1);font-size:15px;font-weight:700;-webkit-user-select:none;user-select:none;background:var(--glass);backdrop-filter:var(--blur);border:1px solid var(--border-soft);padding:8px 14px 8px 10px;border-radius:20px}
.back svg{width:18px;height:18px;stroke:var(--t1);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* Glass card — the core surface language */
.card{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border-soft);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 14px 36px -18px rgba(0,0,0,.65)}
.card.has-photo{backdrop-filter:none;-webkit-backdrop-filter:none;background:#000}

.tog{width:48px;height:29px;border-radius:15px;background:var(--glass-2);border:1px solid var(--border);position:relative;cursor:pointer;transition:background .3s var(--ease);flex-shrink:0}
.tog::after{content:'';position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;background:linear-gradient(180deg,#fff,#e4e4e4);box-shadow:0 2px 5px rgba(0,0,0,.4);transition:transform .3s var(--ease)}
.tog.on{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;box-shadow:var(--accent-glow)}
.tog.on::after{transform:translateX(19px)}

.lg{margin:0 20px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border-soft);border-radius:var(--r);overflow:hidden}
.lr{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--border-soft);cursor:pointer;-webkit-user-select:none;user-select:none;transition:background .18s}
.lr:last-child{border-bottom:none} .lr:active{background:rgba(255,255,255,.05)}
.li{width:42px;height:42px;border-radius:13px;background:var(--glass-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .2s var(--ease);overflow:hidden}
.lr:active .li{transform:scale(.92)}
.li svg{width:20px;height:20px;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.li.on{background:var(--accent-dim);border-color:var(--accent-border);box-shadow:0 0 16px rgba(199,0,136,0.18)}
.lc{flex:1;min-width:0} .lt{font-size:15.5px;font-weight:700;letter-spacing:-.1px}
.ls{font-size:12px;color:var(--t2);margin-top:2px;font-weight:500}
.la{display:flex;align-items:center;gap:8px;flex-shrink:0} .la svg{width:16px;height:16px;stroke:var(--t3);fill:none;stroke-width:2}

.dot{width:7px;height:7px;border-radius:50%;background:#4ADE80;box-shadow:0 0 10px rgba(74,222,128,.8);display:inline-block;flex-shrink:0}

.sl{font-size:11.5px;font-weight:800;letter-spacing:1.4px;color:var(--t3);text-transform:uppercase;padding:0 22px;margin:26px 0 12px}

.sc{margin:0 20px 11px;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border-soft);border-radius:var(--r-lg);display:flex;align-items:center;gap:16px;padding:17px 19px;cursor:pointer;transition:all .25s var(--ease);-webkit-user-select:none;user-select:none}
.sc:active{transform:scale(.98);border-color:var(--accent-border);background:var(--accent-dim)}
.si{width:52px;height:52px;border-radius:16px;background:linear-gradient(155deg,var(--glass-2),var(--glass));border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .22s var(--ease)}
.sc:active .si{transform:scale(.9)}
.si svg{width:23px;height:23px;stroke:rgba(255,255,255,.85);fill:none;stroke-width:1.6}
.st{font-size:16px;font-weight:800;letter-spacing:-.2px} .sb{font-size:12px;color:var(--t2);margin-top:2px;font-weight:500}
.sp{width:38px;height:38px;border-radius:50%;background:var(--accent-dim);border:1px solid var(--accent-border);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sp svg{width:12px;height:12px;fill:var(--accent);stroke:none}

/* Cinematic room photography */
.rphoto{position:relative;overflow:hidden;background:#000}
.rphoto::before{content:'';position:absolute;inset:0;opacity:.6;mix-blend-mode:overlay;background-image:radial-gradient(circle at 25% 20%,rgba(255,255,255,.08),transparent 45%)}
.rphoto.has-photo::before{display:none}
.rphoto::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,transparent 30%,rgba(0,0,0,.35) 60%,rgba(0,0,0,.92) 100%)}
.rphoto-content{position:relative;z-index:2}

.hscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none} .hscroll::-webkit-scrollbar{display:none}
.sp8{height:8px}.sp16{height:16px}.sp40{height:56px}

.qc{transition:opacity .18s var(--ease),transform .18s var(--ease)} .qc:active{opacity:.5;transform:scale(.95)}
.room-tile{transition:transform .3s var(--ease),filter .3s var(--ease)}
.carousel-item{transition:transform .2s ease-out,opacity .2s ease-out;transform-origin:center center} .room-tile:active{transform:scale(.97);filter:brightness(.85)}
.signature-line{width:30px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2));opacity:.9;box-shadow:0 0 8px rgba(199,0,136,0.4)}

.home-reveal{animation:reveal .6s var(--ease) both}
.home-reveal:nth-child(2){animation-delay:.05s} .home-reveal:nth-child(3){animation-delay:.1s}
.home-reveal:nth-child(4){animation-delay:.15s} .home-reveal:nth-child(5){animation-delay:.2s}
@keyframes reveal{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.home-reveal,.qc,.room-tile{animation:none!important;transition:none!important}}

#toast{position:fixed;bottom:calc(var(--nav-h) + var(--safe-bot) + 28px);left:50%;transform:translateX(-50%) translateY(8px);background:rgba(20,20,24,0.85);backdrop-filter:var(--blur);border:1px solid var(--border);padding:11px 22px;border-radius:26px;font-size:13.5px;font-weight:700;color:var(--t1);opacity:0;transition:all .32s var(--ease);pointer-events:none;white-space:nowrap;z-index:200}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.acbtn{padding:13px 6px;border-radius:var(--r-sm);background:var(--glass-2);border:1px solid var(--border);color:var(--t1);font-size:14px;font-weight:700;cursor:pointer;text-align:center;transition:all .22s var(--ease)}
.acbtn:active{background:var(--glass-3);transform:scale(.95)}
.acbtn.sel{background:var(--accent-dim);border-color:var(--accent-border);color:var(--accent);box-shadow:0 0 14px rgba(199,0,136,0.16)}
.pbtn{flex:1;padding:14px;border-radius:var(--r-sm);background:var(--glass-2);border:1px solid var(--border);color:var(--t1);font-size:13.5px;font-weight:700;cursor:pointer;font-family:'Manrope',sans-serif;transition:all .22s}
.pbtn:active{background:var(--glass-3);transform:scale(.96)}

/* Home hero — full-bleed cinematic backdrop */
.hero{position:relative;height:300px;flex-shrink:0;overflow:hidden;background:radial-gradient(140% 100% at 20% -10%,#1c1e26 0%,#0d0e13 55%,#050506 100%)}

// ── COMANDO REAL — nuvem ControlArt ────────────────────
// A nuvem só aceita sendScene,ID (confirmado por teste real) — não aceita
// comando bruto de dispositivo. Por isso cada dispositivo controlável de
// verdade tem um par de cenas ocultas (onScene/offScene) vindas do projeto.
//
// Tenta ler a resposta de verdade (fetch normal); se a nuvem bloquear
// leitura entre origens (CORS), cai pro modo "às cegas" (no-cors) —
// nesse caso o comando ainda é enviado, só não dá pra confirmar.
var caQueue=Promise.resolve();
function sendControlArtCommand(cmd, macRef) {
  if (!STATE.appToken) return Promise.resolve({sent:false, confirmed:false});
  var url = 'https://cacmd2.controlartcloud.com.br/p2pca?tc=' + STATE.appToken + '/' + cmd;
  var run=function(){
    return fetch(url)
      .then(function(res){ return res.text(); })
      .then(function(text){
        var confirmed = macRef ? text.indexOf('setmd,'+macRef+',') !== -1 || text.indexOf(macRef) !== -1 : true;
        return {sent:true, confirmed:confirmed, raw:text};
      })
      .catch(function(){
        return fetch(url, { mode: 'no-cors' })
          .then(function(){ return {sent:true, confirmed:false, blind:true}; })
          .catch(function(){ return {sent:false, confirmed:false}; });
      });
  };
  // Fila única: nunca duas chamadas simultâneas pra nuvem — evita
  // polling e comando de cena colidindo e derrubando um ao outro.
  var result=caQueue.then(run);
  caQueue=result.catch(function(){});
  return result;
}
function sendDeviceCommand(d) {
  var sceneId = d.on ? d.onScene : d.offScene;
  if (!STATE.appToken || !sceneId) {
    return Promise.resolve({sent:false, confirmed:false, noLink:true}); // sem vínculo real — permanece simulado
  }
  return sendControlArtCommand('sendScene,' + sceneId, d.mac);
}

// ── CONSULTA DE STATUS REAL — reflete o interruptor físico ──
// mdcmd_fgetmd,MAC3,MAC4,MAC5 devolve "setmd,MAC,v0,v1,v2,v3,v4,v5" —
// esse tipo de módulo usa 3 entradas + 3 saídas, então o estado do canal N
// fica na posição (3+N). Confirmado por teste real (ligado vs desligado).
function macToDecimal(mac){ return mac.split('-').map(function(h){return parseInt(h,16);}); }
var pollBusy=false;
function pollDeviceStatus(){
  if(!STATE.appToken || pollBusy) return;
  var macs=[]; STATE.devices.forEach(function(d){ if(d.mac && d.channel!==null && macs.indexOf(d.mac)===-1) macs.push(d.mac); });
  if(!macs.length) return;
  pollBusy=true;
  var pending=macs.length;
  function done(){ pending--; if(pending<=0) pollBusy=false; }
  macs.forEach(function(mac){
    var mb=macToDecimal(mac);
    sendControlArtCommand('mdcmd_fgetmd,'+mb[0]+','+mb[1]+','+mb[2], mac).then(function(r){
      if(!r.confirmed || !r.raw){ done(); return; }
      var idx=r.raw.indexOf('setmd,'+mac+',');
      if(idx===-1){ done(); return; }
      var rest=r.raw.slice(idx+('setmd,'+mac+',').length).split(/[\r\n]/)[0];
      var vals=rest.split(',').map(function(v){return v.trim();});
      var changed=false;
      STATE.devices.forEach(function(d){
        if(d.mac===mac && d.channel!==null){
          var pos=3+d.channel;
          if(vals[pos]!==undefined){
            var newOn = vals[pos]==='1';
            if(newOn!==d.on){ d.on=newOn; changed=true; }
          }
        }
      });
      if(changed){ refreshAll(); if(STATE.curPage==='p-devices')renderDevices(); }
      done();
    });
  });
}
var pollTimer=null;
function startPolling(){
  if(pollTimer) return;
  pollDeviceStatus();
  pollTimer=setInterval(pollDeviceStatus, 10000);
}
document.addEventListener('visibilitychange', function(){
  if(document.hidden){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }
  else { startPolling(); }
});

// ── CARROSSEL — o item mais próximo do centro cresce ────────
function setupCarousel(containerId){
  var container=document.getElementById(containerId);
  if(!container) return;
  var ticking=false;
  function update(){
    var rect=container.getBoundingClientRect();
    var centerX=rect.left+rect.width/2;
    var items=container.querySelectorAll('.carousel-item');
    items.forEach(function(item){
      var r=item.getBoundingClientRect();
      var itemCenter=r.left+r.width/2;
      var dist=Math.abs(centerX-itemCenter);
      var maxDist=rect.width/2+r.width/2;
      var t=Math.min(1,dist/maxDist);
      var scale=1.08-t*0.22;
      item.style.transform='scale('+scale.toFixed(3)+')';
      item.style.opacity=(1-t*0.3).toFixed(2);
      item.style.zIndex=String(Math.round((1-t)*10));
    });
    ticking=false;
  }
  container.addEventListener('scroll',function(){
    if(!ticking){ requestAnimationFrame(update); ticking=true; }
  },{passive:true});
  update();
}

  }
  if(hvacs.length){
    html+='<div style="padding:22px 0 0"><div class="sl" style="margin:0 0 12px">Climatização</div><div style="padding:0 20px">'+hvacs.map(function(d){return acWidget(d);}).join('<div class="sp16"></div>')+'</div></div>';
  }
  if(avs.length){
    html+='<div style="padding:22px 0 0"><div class="sl" style="margin:0 0 12px">Áudio e Vídeo</div><div class="lg">'+avs.map(function(d){
      return '<div class="lr" data-action="devtoggle" data-id="'+d.id+'"><div class="li'+(d.on?' on':'')+'">'+deviceIconHtml(d)+'</div><div class="lc"><div class="lt">'+d.name+'</div><div class="ls">'+(d.on?'Ligado':'Desligado')+'</div></div><div class="tog'+(d.on?' on':'')+'" data-action="devtoggle" data-id="'+d.id+'"></div></div>';
    }).join('')+'</div></div>';
  }
  if(!devs.length){
    html+='<div style="padding:40px 22px;text-align:center;color:var(--t3);font-size:13.5px;font-weight:500">Nenhum dispositivo configurado neste ambiente ainda.</div>';
  }
  html+='<div class="sp40"></div>';
  $('#room-detail').innerHTML=html;
}

function acWidget(d){
  var pct=Math.max(0,Math.min(1,(d.val-16)/(30-16)));
  var circumference=2*Math.PI*88;
  return '<div class="card" style="padding:26px 22px">'
    +'<div style="display:flex;flex-direction:column;align-items:center;margin-bottom:22px">'
    +  '<div style="position:relative;width:210px;height:210px">'
    +    '<svg width="210" height="210" viewBox="0 0 210 210" style="position:absolute;top:0;left:0;transform:rotate(135deg)">'
    +      '<circle cx="105" cy="105" r="88" fill="none" stroke="var(--glass-2)" stroke-width="10" stroke-dasharray="'+(circumference*0.75)+' '+circumference+'" stroke-linecap="round"/>'
    +      '<circle cx="105" cy="105" r="88" fill="none" stroke="var(--accent)" stroke-width="10" stroke-dasharray="'+(circumference*0.75)+' '+circumference+'" stroke-dashoffset="'+(circumference*0.75-pct*circumference*0.75)+'" stroke-linecap="round" style="filter:drop-shadow(0 0 12px var(--accent-glow-color))"/>'
    +    '</svg>'
    +    '<div style="position:absolute;left:6px;top:50%;transform:translateY(-50%)"><button class="acbtn" style="width:44px;height:44px;border-radius:50%;font-size:20px;padding:0" data-action="actemp-delta" data-id="'+d.id+'" data-delta="-1">−</button></div>'
    +    '<div style="position:absolute;right:6px;top:50%;transform:translateY(-50%)"><button class="acbtn" style="width:44px;height:44px;border-radius:50%;font-size:20px;padding:0" data-action="actemp-delta" data-id="'+d.id+'" data-delta="1">+</button></div>'
    +    '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none">'
    +      '<div style="font-size:56px;font-weight:200;letter-spacing:-3px;font-family:Manrope,sans-serif" id="ac-temp-'+d.id+'">'+d.val+'°</div>'
    +      '<div style="font-size:12px;color:var(--t2);margin-top:2px;font-weight:600">'+d.name+'</div>'
    +    '</div>'
    +  '</div>'
    +  '<div class="tog'+(d.on?' on':'')+'" data-action="devtoggle" data-id="'+d.id+'" style="margin-top:16px"></div>'
    +'</div>'
    +'<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">'
    +  '<div class="chip" data-action="toast" data-msg="Turbo ativado">Turbo</div>'
    +  '<div class="chip" data-action="toast" data-msg="Visor alternado">Visor</div>'
    +  '<div class="chip" data-action="toast" data-msg="Modo Dormir ativado">Dormir</div>'
    +'</div></div>';
}

function renderScenes(){
  var fav=STATE.scenes.filter(function(s){return s.fav;});
  var rest=STATE.scenes.filter(function(s){return !s.fav;});
  function row(s){
    return '<div class="sc" data-action="scene" data-id="'+s.id+'" data-name="'+s.name+'"><div class="si">'+ic(s.icon,22)+'</div><div style="flex:1"><div class="st">'+s.name+'</div><div class="sb">'+(s.desc||'')+'</div></div><div class="sp" data-action="scene" data-id="'+s.id+'" data-name="'+s.name+'"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div></div>';
  }
  var html=(fav.length?'<div class="sl" style="margin-top:6px">Favoritas</div>'+fav.map(row).join(''):'')
    +(rest.length?'<div class="sl">'+(fav.length?'Todas as cenas':'Cenas'):'')+(rest.length?'</div>'+rest.map(row).join(''):'')
    +'<div class="sp40"></div>';
  $('#p-scenes').innerHTML='<div class="ph"><h1>Cenas</h1></div>'+html;
}

function renderDevices(){
  var allowedIds=visibleRooms().map(function(r){return r.id;});
  var html=STATE.devices.filter(function(d){return allowedIds.indexOf(d.room)!==-1;}).map(function(d){
    var room=STATE.rooms.find(function(r){return r.id===d.room;});
    var statusText=d.kind==='hvac'?(d.on?d.val+'°':'Desligado'):(d.on?'Ligado':'Desligado');
    return '<div class="lr" data-action="devtoggle" data-id="'+d.id+'"><div class="li'+(d.on?' on':'')+'">'+deviceIconHtml(d)+'</div><div class="lc"><div class="lt">'+d.name+'</div><div class="ls">'+(room?room.name:'')+' · '+statusText+'</div></div><div class="tog'+(d.on?' on':'')+'" data-action="devtoggle" data-id="'+d.id+'"></div></div>';
  }).join('');
  $('#p-devices').innerHTML='<div class="ph"><h1>Dispositivos</h1></div><div class="lg" style="margin-top:2px">'+html+'</div><div class="sp40"></div>';
}

function renderMore(){
  var html='<div class="ph"><h1>Mais</h1></div>';
  if(STATE.currentUser){
    html+='<div class="sl" style="margin-top:6px">Perfil</div><div class="lg">'
      +'<div class="lr"><div class="li"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/></svg></div><div class="lc"><div class="lt">'+STATE.currentUser.name+'</div><div class="ls">'+(STATE.currentUser.role==='admin'?'Administrador':'Família')+'</div></div></div>'
      +'<div class="lr" data-action="switchuser"><div class="li">'+ic('switchuser',19,'var(--t2)')+'</div><div class="lc"><div class="lt">Trocar usuário</div></div></div>'
      +'</div>';
    if(STATE.currentUser.role==='admin' && STATE.users.length){
      html+='<div class="sl">Usuários cadastrados</div><div class="lg">'
        +STATE.users.map(function(u){
          var access=u.role==='admin'?'Acesso total':((u.rooms||[]).length+' ambiente(s) liberado(s)');
          return '<div class="lr"><div class="li"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--t2)" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/></svg></div><div class="lc"><div class="lt">'+u.name+'</div><div class="ls">'+(u.role==='admin'?'Admin':'Família')+' · '+access+'</div></div></div>';
        }).join('')
        +'</div><p style="padding:10px 22px 0;font-size:11.5px;color:var(--t3)">Pra adicionar ou editar usuários, use o configurador e gere o app de novo.</p>';
    }
  }
  html+='<div class="sl">Sistema</div><div class="lg"><div class="lr"><div class="li">'+ic('info',19,'var(--t2)')+'</div><div class="lc"><div class="lt">Projeto</div><div class="ls">'+STATE.clientName+'</div></div></div></div><div class="sp40"></div>';
  $('#p-more').innerHTML=html;
}

function refreshAll(){renderHome();renderDevices();if(STATE.curRoom)renderRoomDetail(STATE.curRoom);}

function handleAction(el){
  var a=el.dataset.action;
  if(a==='page')goPage(el.dataset.page);
  else if(a==='selectuser')handleSelectUser(parseInt(el.dataset.id,10));
  else if(a==='switchuser')switchUser();
  else if(a==='submitpin')submitPin(parseInt(el.dataset.id,10));
  else if(a==='cancelpin')renderProfileScreen();
  else if(a==='room')goRoom(el.dataset.room);
  else if(a==='back')goBack();
  else if(a==='toast')toast(el.dataset.msg);
  else if(a==='scene'){
    var sid=parseInt(el.dataset.id,10);
    var sname=el.dataset.name;
    var scn=STATE.scenes.find(function(x){return x.id===sid;});
    if(scn && scn.actions && scn.actions.length){
      // Cena customizada: dispara cada dispositivo real em sequência; sem vínculo, só simula localmente.
      var chain=Promise.resolve();
      var anyReal=false;
      scn.actions.forEach(function(act){
        var dev=STATE.devices.find(function(x){return x.id===act.deviceId;});
        if(!dev) return;
        dev.on=act.on;
        if(dev.onScene && dev.offScene){
          anyReal=true;
          chain=chain.then(function(){ return sendDeviceCommand(dev); });
        }
      });
      refreshAll();
      chain.then(function(){ toast(sname+(anyReal?' — executada':' — executada (simulada)')); });
    } else if(STATE.appToken && sid>0){
      sendControlArtCommand('sendScene,'+sid).then(function(r){
        toast(r.sent ? sname+' — executada' : 'Não consegui falar com a central agora');
      });
    } else {
      toast('Cena "'+sname+'" executada');
    }
  }
  else if(a==='devtoggle'){
    var id=parseInt(el.dataset.id,10);
    var d=STATE.devices.find(function(x){return x.id===id;});
    if(d){
      d.on=!d.on;
      refreshAll();
      if(d.onScene && d.offScene){
        sendDeviceCommand(d).then(function(r){
          if(!r.sent){
            toast('Não consegui falar com a central agora');
            d.on=!d.on; refreshAll(); // desfaz — não confiar no otimista se nem saiu
          } else if(r.confirmed){
            toast(d.name+' — confirmado pela central');
          } else if(r.blind){
            toast(d.name+' — comando enviado (sem confirmação)');
          }
        });
      }
    }
  }
  else if(a==='roomtoggle'){
    var roomId=el.dataset.room;
    var room=STATE.rooms.find(function(r){return r.id===roomId;});
    var roomDevs=STATE.devices.filter(function(x){return x.room===roomId;});
    if(!room || !roomDevs.length) return;
    var turnOn=!roomDevs.every(function(x){return x.on;});
    roomDevs.forEach(function(x){ x.on=turnOn; });
    refreshAll();
    if(room.onScene && room.offScene){
      // Cena única de ambiente encontrada no projeto — 1 chamada só, mais rápido e mais fiel.
      sendControlArtCommand('sendScene,'+(turnOn?room.onScene:room.offScene)).then(function(r){
        toast(r.sent ? room.name+' — '+(turnOn?'tudo ligado':'tudo desligado') : 'Não consegui falar com a central agora');
      });
    } else {
      // Sem cena de ambiente pronta: dispara cada dispositivo com vínculo real, em sequência.
      var realDevs=roomDevs.filter(function(x){return x.onScene && x.offScene;});
      if(!realDevs.length){ toast(room.name+' — '+(turnOn?'tudo ligado':'tudo desligado')); return; }
      var chain=Promise.resolve();
      realDevs.forEach(function(x){
        chain=chain.then(function(){ return sendDeviceCommand(x); });
      });
      chain.then(function(){ toast(room.name+' — '+(turnOn?'tudo ligado':'tudo desligado')); });
    }
  }
  else if(a==='actemp'){var id2=parseInt(el.dataset.id,10);var d2=STATE.devices.find(function(x){return x.id===id2;});if(d2){d2.val=parseInt(el.dataset.temp,10);var disp=$('#ac-temp-'+id2);if(disp)disp.textContent=d2.val+'°';if(STATE.curRoom)renderRoomDetail(STATE.curRoom);renderDevices();toast(d2.name+': '+d2.val+'°');}}
  else if(a==='actemp-delta'){var id3=parseInt(el.dataset.id,10);var d3=STATE.devices.find(function(x){return x.id===id3;});if(d3){d3.val=Math.max(16,Math.min(30,d3.val+parseInt(el.dataset.delta,10)));if(STATE.curRoom)renderRoomDetail(STATE.curRoom);renderDevices();toast(d3.name+': '+d3.val+'°');}}
}
document.addEventListener('click',function(e){var t=e.target.closest('[data-action]');if(t)handleAction(t);});
STATE.currentUser=loadCurrentUser();
renderHome();renderRooms();renderScenes();renderDevices();renderMore();
if(STATE.users.length && !STATE.currentUser){
  renderProfileScreen();
  document.getElementById('p-home').classList.remove('active');
  document.getElementById('p-profile').classList.add('active');
  document.getElementById('nav').style.display='none';
  STATE.curPage='p-profile';
  STATE.history=['p-profile'];
} else {
  startPolling();
}
</script></body></html>
